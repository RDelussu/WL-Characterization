apiVersion: v1
kind: Pod
metadata:
  name: periodic-low-cpu
  labels:
    app: periodic-low-cpu
spec:
  containers:
    - name: periodic-low-cpu-container
      image: chrimadeddu/periodic_low_cpu_kria:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: exec_time
          value: "30"
        - name: idle_time
          value: "5"
        - name: iterations
          value: "2"
      ports:
        - containerPort: 8080
  restartPolicy: Never
  tolerations:
    - key: "cpu-control"
      operator: "Equal"
      value: "wait"
      effect: "NoSchedule"
  nodeSelector:
    role: worker
