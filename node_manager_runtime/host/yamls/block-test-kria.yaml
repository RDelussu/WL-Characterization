apiVersion: v1
kind: Pod
metadata:
  name: block-test-pod
  labels:
    app: block-test
spec:
  containers:
    - name: block-test-container
      image: chrimadeddu/block_test_kria:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: test_size
          value: "10000"
        - name: chunk_size
          value: "1024"     
        - name: loops
          value: "1"            
      ports:
        - containerPort: 8080
  restartPolicy: Never
  nodeSelector:
    role: worker
