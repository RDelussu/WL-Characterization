apiVersion: v1
kind: Pod
metadata:
  name: constant-low-cpu
  labels:
    app: constant-low-cpu
spec:
  containers:
    - name: constant-low-cpu-container
      image: chrimadeddu/constant_low_cpu_pc:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: exec_time
          value: "30"
        - name: idle_time
          value: "5"
      ports:
        - containerPort: 8080
  restartPolicy: Never
