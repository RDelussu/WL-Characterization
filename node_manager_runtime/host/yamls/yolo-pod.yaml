apiVersion: v1
kind: Pod
metadata:
  name: yolo
  labels:
    app: yolo
spec:
  nodeSelector:
    role: worker
  restartPolicy: Never
  tolerations:
    - key: "cpu-control"
      operator: "Equal"
      value: "wait"
      effect: "NoSchedule"
  containers:
  - name: yolo-container
    image: chrimadeddu/yolo-app-ubuntu
    securityContext:
      privileged: true
    stdin: true
    tty: true
    env:
      - name: PYTHONPATH
        value: "/usr/lib/python3.10/site-packages"
      - name: LD_LIBRARY_PATH
        value: "/opt/xilinx/lib:/usr/lib:/lib"
      - name: LD_PRELOAD
        value: "/usr/lib/libglog.so"
    volumeMounts:
    - name: dri-device
      mountPath: /dev/dri
    - name: dfx-socket
      mountPath: /tmp/dfx-mgrd.socket
    - name: dpu-drivers
      mountPath: /lib/firmware/xilinx
    - name: tmp-shared
      mountPath: /tmp
  volumes:
  - name: dri-device
    hostPath:
      path: /dev/dri
      type: Directory
  - name: dfx-socket
    hostPath:
      path: /tmp/dfx-mgrd.socket
      type: Socket
  - name: dpu-drivers
    hostPath:
      path: /lib/firmware/xilinx
      type: Directory
  - name: tmp-shared
    hostPath:
      path: /tmp
