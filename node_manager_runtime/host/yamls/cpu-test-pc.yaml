apiVersion: v1
kind: Pod
metadata:
  name: cpu-test-pc
  labels:
    app: cpu-test-pc
spec:
  containers:
    - name: cpu-test-pc-container
      image: chrimadeddu/cpu_test_pc:latest
      imagePullPolicy: Always
      env:
        - name: nodes
          value: "400000"
        - name: edges
          value: "800000"   
        - name: num_sources
          value: "1000"                
      ports:
        - containerPort: 8080
  restartPolicy: Never
  tolerations:
    - key: "cpu-control"
      operator: "Equal"
      value: "wait"
      effect: "NoSchedule"
