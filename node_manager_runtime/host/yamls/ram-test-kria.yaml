apiVersion: v1
kind: Pod
metadata:
  name: ram-test-pod
  labels:
    app: ram-test
spec:
  containers:
    - name: ram-test-container
      image: chrimadeddu/ram_test_kria:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: duration
          value: "60"
        - name: allocated_ram
          value: "1024"      
      ports:
        - containerPort: 8080
  restartPolicy: Never
  nodeSelector:
    role: worker
