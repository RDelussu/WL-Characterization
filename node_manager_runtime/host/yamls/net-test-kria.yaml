apiVersion: v1
kind: Pod
metadata:
  name: net-test-pod
  labels:
    app: net-test
spec:
  containers:
    - name: net-test-container
      image: chrimadeddu/net_test_kria:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: duration
          value: "60"
        - name: n_threads
          value: "10" 
      ports:
        - containerPort: 8080
  restartPolicy: Never
  nodeSelector:
    role: worker
